name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run: a stale green check is worse than no check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# How a release is cut: merge to main (this workflow tests it and builds the release variant), then
# tag that same commit. The tag run skips the tests and the debug APK, because main already ran them
# for that exact commit — re-running them would double the cost of every release for no extra signal
# — and instead does the one thing only a tag can do: sign the APK and attach it to the release.
# A tag on a commit that is *not* on main still gets the full run, tests included.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # Write access is for one thing only: attaching the APK this job built to the GitHub release.
    permissions:
      contents: write

    env:
      # Secrets cannot be read in a step's `if:`, so their presence is turned into a plain variable
      # the steps branch on. A fork or a pull request from one has no secrets at all, and the
      # release variant is then built unsigned exactly as before — it is still a full R8 run and
      # still fails on a bad keep rule.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # All history and branches: the tag check below needs to see whether this commit is on main.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle wrapper, the dependency cache and the build cache, all keyed on the
      # version catalog and build scripts, which is what actually decides whether a rebuild is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The signing key lives in repository secrets, never in the repository: a private key in git
      # history cannot be un-published. It is decoded to the runner's temporary directory and
      # described by the same `keystore.properties` the local build reads, so signing happens through
      # one code path whether the build runs here or on a workstation.
      - name: Provide the release signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties

      # Is this commit already tested? Answered only for tags, because that is the only case where
      # the same commit can arrive twice. `--is-ancestor` is deliberately the check rather than an
      # equality: a release tagged a few commits behind main has still been tested by main.
      - name: Has main already tested this commit?
        id: ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        if: steps.ancestry.outputs.tested != 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        if: steps.ancestry.outputs.tested != 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      # Signed when the key is available, unsigned otherwise — either way this exercises the R8
      # configuration and keep rules on every push.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success() && steps.ancestry.outputs.tested != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The build people install comes from here rather than from someone's laptop: the artifact and
      # the commit it was built from are the same record.
      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mynote-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the signed APK to the release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          # --clobber so a re-run replaces the asset instead of failing on the name it already has.
          gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
          # The checksum of the file that was *actually* attached. Two builds of one commit are not
          # byte-identical (R8 and the zip are not bit-reproducible here), so a digest written by hand
          # into the release notes goes stale the moment this job re-uploads the APK.
          sha256sum app/build/outputs/apk/release/*.apk > "$RUNNER_TEMP/checksum.txt"
          sed 's|app/build/outputs/apk/release/||' "$RUNNER_TEMP/checksum.txt" \
            > "app/build/outputs/apk/release/$(basename "$(ls app/build/outputs/apk/release/*.apk)").sha256"
          gh release upload "$tag" app/build/outputs/apk/release/*.sha256 --clobber
